version: v2
name: testserver
services:
- name: txx
  run: "sh -c 'echo \"[nstest] PORTER_PR_NAMESPACE=$PORTER_PR_NAMESPACE\"; echo \"[nstest] PORTER_PR_BRANCH=$PORTER_PR_BRANCH\"; getent hosts \"$PORTER_APP_SERVICE_NAME.$PORTER_PR_NAMESPACE.svc.cluster.local\" && echo \"[nstest] ns-dns OK\" || echo \"[nstest] ns-dns FAIL\"; getent hosts \"$PORTER_APP_SERVICE_NAME.$PORTER_PR_BRANCH.svc.cluster.local\" && echo \"[nstest] branch-dns OK\" || echo \"[nstest] branch-dns FAIL-expected\"; exec python3 /app/server.py'"
  type: web
  instances: 1
  cpuCores: 0.2
  ramMegabytes: 300
  terminationGracePeriodSeconds: 30
  port: 3000
  autoscaling:
    enabled: true
    gpu: false
    minInstances: 1
    maxInstances: 10
    cpuThresholdPercent: 0
    memoryThresholdPercent: 0
    gpuThresholdPercent: 0
    vramThresholdPercent: 0
  domains:
  - name: testthisapp.com
  - name: testthisappdfdfdfdfdfdfd.com
  sleep: false
build:
  context: ./
  method: docker
  dockerfile: ./Dockerfile
autoRollback:
  enabled: false
